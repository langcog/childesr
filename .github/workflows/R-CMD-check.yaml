name: R-CMD-check

on:
  push:
    branches: [main, master, redivis]
  pull_request:
  schedule:
    # nightly canary WITH network: catches Redivis/data breakage before
    # users (and long before a CRAN check would)
    - cron: "23 9 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  cran-simulation:
    # no token: every network test skips, exactly as on CRAN
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          # redivis pulls arrow transitively; without these the runner
          # compiles arrow from source (1-2 h) whenever the image updates
          LIBARROW_BINARY: "true"
          NOT_CRAN: "true"
        with:
          extra-packages: |
            any::rcmdcheck
            github::redivis/redivis-r
          needs: check
      # r-lib's check action sets NOT_CRAN=true by default, which would
      # re-enable the vignette's network chunks; simulate CRAN faithfully
      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: "false"
        with:
          error-on: '"warning"'

  network-tests:
    # full test suite (smoke + characterization) against Redivis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          LIBARROW_BINARY: "true"
          NOT_CRAN: "true"
        with:
          extra-packages: |
            any::testthat
            any::pkgload
            github::redivis/redivis-r
      - name: Run tests
        env:
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
        run: |
          Rscript -e 'pkgload::load_all("."); testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
